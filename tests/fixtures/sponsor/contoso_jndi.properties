# =============================================================
# Contoso Customer Service — JNDI Configuration
# Covers §1.b JNDI requirement.
# Java Naming and Directory Interface bindings for datasources,
# messaging queues, and EJB remote interfaces.
# =============================================================

# ── JNDI provider ──────────────────────────────────────────────
java.naming.factory.initial=com.sun.jndi.ldap.LdapCtxFactory
java.naming.provider.url=ldap://contoso-ldap.internal:389/dc=contoso,dc=com
java.naming.security.authentication=simple
java.naming.security.principal=cn=serviceaccount,dc=contoso,dc=com

# ── JDBC DataSources ───────────────────────────────────────────
# Primary customer database
jdbc/ContosoCustomerDB=javax.sql.DataSource
jdbc/ContosoCustomerDB.url=jdbc:sqlserver://db.contoso.internal:1433;databaseName=CustomerDB
jdbc/ContosoCustomerDB.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
jdbc/ContosoCustomerDB.user=crmuser
jdbc/ContosoCustomerDB.maxPoolSize=20

# Read-replica for reporting
jdbc/ContosoReportingDB=javax.sql.DataSource
jdbc/ContosoReportingDB.url=jdbc:sqlserver://rdb.contoso.internal:1433;databaseName=CustomerDB
jdbc/ContosoReportingDB.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JMS Queues / Topics ────────────────────────────────────────
# Order processing queue
jms/OrderProcessingQueue=javax.jms.Queue
jms/OrderProcessingQueue.connectionFactory=jms/ContosoConnectionFactory

# Support ticket notifications
jms/SupportTicketTopic=javax.jms.Topic
jms/SupportTicketTopic.connectionFactory=jms/ContosoConnectionFactory

# Refund approval queue
jms/RefundApprovalQueue=javax.jms.Queue

# ── JMS Connection Factory ─────────────────────────────────────
jms/ContosoConnectionFactory=javax.jms.ConnectionFactory
jms/ContosoConnectionFactory.broker=tcp://mq.contoso.internal:61616

# ── EJB Remote Interfaces ──────────────────────────────────────
ejb/CustomerServiceBean=remote://ejb.contoso.internal:4447/CustomerServiceApp/CustomerServiceBean!com.contoso.ICustomerService
ejb/OrderServiceBean=remote://ejb.contoso.internal:4447/CustomerServiceApp/OrderServiceBean!com.contoso.IOrderService

# ── Environment entries ────────────────────────────────────────
java:comp/env/maxOrderValue=5000.00
java:comp/env/defaultPriority=Normal
java:comp/env/supportEmailAddress=support@contoso.com
java:comp/env/loyaltyPointsPerDollar=10
