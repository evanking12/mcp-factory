name: Creator Replay Demo Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/creator-challenge/replay-demo/**"
      - ".github/workflows/pages-replay-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-replay-demo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static replay demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/creator-challenge/replay-demo

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
