name: Sponsor MSRPC Runtime Proof

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: mcp-factory-rg
  KEY_VAULT: mcp-factory-kv
  PIPELINE_URL: https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io

jobs:
  msrpc-runtime:
    name: Controlled DCE/RPC-compatible runtime proof
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch pipeline key
        id: runtime-secrets
        run: |
          pipeline_key="$(az keyvault secret show --vault-name "$KEY_VAULT" --name pipeline-api-key --query value -o tsv)"
          echo "::add-mask::$pipeline_key"
          echo "pipeline_key=$pipeline_key" >> "$GITHUB_OUTPUT"

      - name: Run MSRPC runtime proof
        run: |
          python scripts/ci_verify.py msrpc-runtime-proof \
            --base-url "$PIPELINE_URL" \
            --pipeline-key "${{ steps.runtime-secrets.outputs.pipeline_key }}" \
            --artifact-dir ci_artifacts/demo/legacy/msrpc \
            --matrix-out ci_artifacts/demo/legacy-runtime-matrix/summary.json \
            --sentinel "MCP_FACTORY_MSRPC_${{ github.run_id }}"

      - name: Upload MSRPC runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-msrpc-runtime
          path: ci_artifacts/demo
          if-no-files-found: error
