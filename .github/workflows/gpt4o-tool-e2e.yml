name: GPT-4o Tool E2E

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: mcp-factory-rg
  VM_NAME: mcpfactory-runner-vm
  KEY_VAULT: mcp-factory-kv
  BRIDGE_URL: http://20.124.33.45:8090
  PIPELINE_URL: https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io
  STORAGE_ACCOUNT: mcpfactorystore
  ARTIFACT_CONTAINER: artifacts

jobs:
  gpt-tool-e2e:
    name: Manual cloud GPT tool-call verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start bridge VM
        shell: pwsh
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$env:STORAGE_ACCOUNT" --container "$env:ARTIFACT_CONTAINER" --reason "gpt4o-e2e-before-vm-start" --job-id "${{ github.run_id }}"
          az vm start -g "$env:RESOURCE_GROUP" -n "$env:VM_NAME"
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$env:STORAGE_ACCOUNT" --container "$env:ARTIFACT_CONTAINER" --reason "gpt4o-e2e-vm-started" --job-id "${{ github.run_id }}"

      - name: Fetch runtime secrets
        id: runtime-secrets
        shell: pwsh
        run: |
          $bridgeSecret = az keyvault secret show --vault-name $env:KEY_VAULT --name gui-bridge-secret --query value -o tsv
          $pipelineKey = az keyvault secret show --vault-name $env:KEY_VAULT --name pipeline-api-key --query value -o tsv
          Write-Output "::add-mask::$bridgeSecret"
          Write-Output "::add-mask::$pipelineKey"
          "bridge_secret=$bridgeSecret" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pipeline_key=$pipelineKey" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Wait for bridge health
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 84; $i++) {
            python scripts/ci_verify.py touch-bridge-lease --storage-account "$env:STORAGE_ACCOUNT" --container "$env:ARTIFACT_CONTAINER" --reason "gpt4o-e2e-health-wait-$i" --job-id "${{ github.run_id }}"
            try {
              Invoke-RestMethod -Uri "$env:BRIDGE_URL/health" -Headers @{ "X-Bridge-Key" = "${{ steps.runtime-secrets.outputs.bridge_secret }}" } -TimeoutSec 5 | Out-Host
              exit 0
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          throw "Bridge did not become healthy in time"

      - name: Create deterministic CMD target
        id: target
        shell: pwsh
        run: |
          $sentinel = "MCP_FACTORY_E2E_${{ github.run_id }}"
          $target = Join-Path $env:RUNNER_TEMP "mcp-factory-e2e.cmd"
          @(
            "@echo off",
            "goto :eof",
            "REM Echo deterministic sentinel for GPT/tool E2E.",
            ":EchoSentinel",
            "echo $sentinel",
            "exit /b 0"
          ) | Set-Content -Path $target -Encoding ASCII
          "sentinel=$sentinel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run cloud GPT tool E2E
        shell: pwsh
        run: |
          $artifactDir = "ci_artifacts/gpt4o-tool-e2e"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          python scripts/ci_verify.py cloud-gpt-e2e `
            --base-url "$env:PIPELINE_URL" `
            --pipeline-key "${{ steps.runtime-secrets.outputs.pipeline_key }}" `
            --target "${{ steps.target.outputs.target }}" `
            --tool-name EchoSentinel `
            --sentinel "${{ steps.target.outputs.sentinel }}" `
            --artifact-dir "$artifactDir" `
            --transcript "$artifactDir/transcript.json" `
            --lease-storage-account "$env:STORAGE_ACCOUNT" `
            --lease-container "$env:ARTIFACT_CONTAINER" `
            --lease-job-id "${{ github.run_id }}"

      - name: Print GPT E2E artifact summary
        if: always()
        shell: pwsh
        run: |
          $artifactDir = "ci_artifacts/gpt4o-tool-e2e"
          if (-not (Test-Path $artifactDir)) {
            Write-Host "No GPT E2E artifact directory exists."
            exit 0
          }
          $paths = @(
            "transcript.json",
            "selected-invocable.json",
            "generated-mcp-schema.json",
            "job-status-history.json",
            "downloaded-mcp-schema.json"
          )
          foreach ($name in $paths) {
            $path = Join-Path $artifactDir $name
            Write-Host "$name exists=$(Test-Path $path)"
          }
          $transcriptPath = Join-Path $artifactDir "transcript.json"
          if (Test-Path $transcriptPath) {
            $transcript = Get-Content $transcriptPath -Raw | ConvertFrom-Json
            $toolCallCount = @($transcript.events | Where-Object { $_.type -eq "tool_call" }).Count
            $toolResultCount = @($transcript.events | Where-Object { $_.type -eq "tool_result" }).Count
            Write-Host "job_id=$($transcript.job_id)"
            Write-Host "sentinel=$($transcript.sentinel)"
            Write-Host "tool_call_events=$toolCallCount"
            Write-Host "tool_result_events=$toolResultCount"
          }
          $selectedPath = Join-Path $artifactDir "selected-invocable.json"
          if (Test-Path $selectedPath) {
            $selected = Get-Content $selectedPath -Raw | ConvertFrom-Json
            Write-Host "selected_tool=$($selected.name)"
          }
          $schemaPath = Join-Path $artifactDir "generated-mcp-schema.json"
          if (Test-Path $schemaPath) {
            $schema = Get-Content $schemaPath -Raw | ConvertFrom-Json
            Write-Host "schema_tool_count=$(@($schema.tools).Count)"
          }

      - name: Upload GPT E2E transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt4o-tool-e2e
          path: ci_artifacts
          if-no-files-found: ignore

      - name: Deallocate bridge VM
        if: always()
        shell: pwsh
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$env:STORAGE_ACCOUNT" --container "$env:ARTIFACT_CONTAINER" --reason "gpt4o-e2e-before-deallocate" --job-id "${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "lease touch failed before deallocate" }
          az vm deallocate -g "$env:RESOURCE_GROUP" -n "$env:VM_NAME"
