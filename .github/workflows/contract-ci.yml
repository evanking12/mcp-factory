name: Contract CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: Sponsor-scope fixture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r api/requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -q --ignore=tests/test_mcp_stdio.py

      - name: Run sponsor-scope discovery fixtures
        run: python scripts/ci_verify.py run-fixture-contract --out ci_artifacts/contract

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-ci-artifacts
          path: ci_artifacts/contract
          if-no-files-found: error

