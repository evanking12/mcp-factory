name: Deployed Provider Smoke

on:
  workflow_dispatch:
    inputs:
      pipeline_url:
        description: "Deployed pipeline URL"
        required: false
        default: "https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io"
      sentinel:
        description: "Smoke-test sentinel"
        required: false
        default: "MCP_FACTORY_PROVIDER_SMOKE"

permissions:
  id-token: write
  contents: read

env:
  KEY_VAULT: mcp-factory-kv
  PIPELINE_URL: ${{ github.event.inputs.pipeline_url || 'https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io' }}
  DEMO_SENTINEL: ${{ github.event.inputs.sentinel || 'MCP_FACTORY_PROVIDER_SMOKE' }}

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch pipeline key
        run: |
          pipeline_key="$(az keyvault secret show --vault-name "$KEY_VAULT" --name pipeline-api-key --query value -o tsv)"
          echo "::add-mask::$pipeline_key"
          echo "PIPELINE_API_KEY=$pipeline_key" >> "$GITHUB_ENV"

      - name: Run provider matrix smoke
        run: |
          python scripts/ci_verify.py deployed-provider-matrix-smoke \
            --pipeline-url "$PIPELINE_URL" \
            --pipeline-key "$PIPELINE_API_KEY" \
            --sentinel "$DEMO_SENTINEL" \
            --out ci_artifacts/provider-smoke/summary.json

      - name: Classify failure
        if: failure() || cancelled()
        run: |
          python scripts/ci_verify.py classify-failure \
            --text "Deployed provider smoke failed" \
            --out ci_artifacts/provider-smoke/failure-diagnosis.json

      - name: Upload provider smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-provider-smoke
          path: ci_artifacts/provider-smoke
          if-no-files-found: error

