name: Demo Readiness

on:
  workflow_dispatch:
    inputs:
      ui_url:
        description: "Deployed UI URL"
        required: false
        default: "https://mcp-factory-ui.icycoast-8ddfa278.eastus.azurecontainerapps.io"
      pipeline_url:
        description: "Deployed pipeline URL"
        required: false
        default: "https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io"
      canonical_run_id:
        description: "Canonical Sponsor Demo E2E run ID"
        required: false
        default: "24578415657"
      sentinel:
        description: "Smoke-test sentinel"
        required: false
        default: "MCP_FACTORY_UI_DEMO_SENTINEL"
  schedule:
    - cron: "0 */6 * * 1-5"

permissions:
  id-token: write
  contents: read
  actions: read

env:
  RESOURCE_GROUP: mcp-factory-rg
  VM_NAME: mcpfactory-runner-vm
  KEY_VAULT: mcp-factory-kv
  STORAGE_ACCOUNT: mcpfactorystore
  ARTIFACT_CONTAINER: artifacts
  UI_URL: ${{ github.event.inputs.ui_url || 'https://mcp-factory-ui.icycoast-8ddfa278.eastus.azurecontainerapps.io' }}
  PIPELINE_URL: ${{ github.event.inputs.pipeline_url || 'https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io' }}
  DEMO_SENTINEL: ${{ github.event.inputs.sentinel || 'MCP_FACTORY_UI_DEMO_SENTINEL' }}
  CANONICAL_RUN_ID: ${{ github.event.inputs.canonical_run_id || '24578415657' }}

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch pipeline key
        run: |
          pipeline_key="$(az keyvault secret show --vault-name "$KEY_VAULT" --name pipeline-api-key --query value -o tsv)"
          echo "::add-mask::$pipeline_key"
          echo "PIPELINE_API_KEY=$pipeline_key" >> "$GITHUB_ENV"

      - name: Deployed UI SOAP smoke
        run: |
          python scripts/ci_verify.py deployed-ui-smoke \
            --ui-url "$UI_URL" \
            --sentinel "$DEMO_SENTINEL" \
            --out ci_artifacts/demo-readiness/deployed-ui-smoke.json

      - name: Deployed provider matrix smoke
        run: |
          python scripts/ci_verify.py deployed-provider-matrix-smoke \
            --pipeline-url "$PIPELINE_URL" \
            --pipeline-key "$PIPELINE_API_KEY" \
            --sentinel "$DEMO_SENTINEL" \
            --out ci_artifacts/demo-readiness/deployed-provider-matrix-smoke.json

      - name: Azure operational proof
        if: always()
        run: |
          python scripts/ci_verify.py azure-operational-proof \
            --resource-group "$RESOURCE_GROUP" \
            --vm-name "$VM_NAME" \
            --storage-account "$STORAGE_ACCOUNT" \
            --container "$ARTIFACT_CONTAINER" \
            --out ci_artifacts/demo-readiness/azure-operational-proof.json

      - name: Verify proof index canonical run
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          run_id = os.environ["CANONICAL_RUN_ID"]
          proof_index = Path("docs/sponsor/proof-index.md")
          readme = Path("README.md")
          text = proof_index.read_text(encoding="utf-8") + "\n" + readme.read_text(encoding="utf-8")
          result = {
              "passed": run_id in text,
              "canonical_run_id": run_id,
              "proof_index": str(proof_index),
              "readme": str(readme),
          }
          out = Path("ci_artifacts/demo-readiness/canonical-proof-link.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2), encoding="utf-8")
          if not result["passed"]:
              raise SystemExit(f"canonical run {run_id} is not referenced by README/proof index")
          PY

      - name: Classify failure
        if: failure() || cancelled()
        run: |
          python scripts/ci_verify.py classify-failure \
            --text "Demo readiness workflow failed" \
            --out ci_artifacts/demo-readiness/failure-diagnosis.json

      - name: Summarize readiness
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("ci_artifacts/demo-readiness")
          summary = {"passed": True, "files": {}}
          for path in sorted(root.glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  data = {"parse_error": str(exc)}
              summary["files"][path.name] = data
              if data.get("passed") is False:
                  summary["passed"] = False
          root.mkdir(parents=True, exist_ok=True)
          (root / "demo-readiness-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print("## Demo Readiness")
          print("")
          print(f"- Passed: {summary['passed']}")
          print(f"- Files: {', '.join(summary['files'])}")
          PY

      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-readiness
          path: ci_artifacts/demo-readiness
          if-no-files-found: error
