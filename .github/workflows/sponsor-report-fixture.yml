name: Sponsor Report Fixture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci_verify.py"
      - "tests/test_ci_verify_sponsor_summary.py"
      - "tests/fixtures/sponsor/sponsor-binary-manifest.json"
      - ".github/workflows/sponsor-report-fixture.yml"

permissions:
  contents: read

jobs:
  report-fixture:
    name: Local sponsor report fixture
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal dependencies
        run: pip install -r requirements.txt -r api/requirements.txt

      - name: Run report-focused tests
        run: python -m pytest tests/test_ci_verify_sponsor_summary.py tests/test_legacy_provider_executor.py

      - name: Compile report tooling
        run: python -m py_compile scripts/ci_verify.py api/main.py api/executor.py api/legacy_provider.py ui/main.py
