name: Sponsor Demo E2E

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: bridge-vm-e2e
  cancel-in-progress: false

env:
  RESOURCE_GROUP: mcp-factory-rg
  VM_NAME: mcpfactory-runner-vm
  KEY_VAULT: mcp-factory-kv
  BRIDGE_URL: http://20.124.33.45:8090
  PIPELINE_URL: https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io
  PIPELINE_APP: mcp-factory-pipeline
  STORAGE_ACCOUNT: mcpfactorystore
  ARTIFACT_CONTAINER: artifacts

jobs:
  non-vm-sponsor-coverage:
    name: Non-VM sponsor-required formats
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r api/requirements.txt

      - name: Check sponsor fixture formats
        run: python scripts/ci_verify.py run-sponsor-contract --out ci_artifacts/demo/non-vm

      - name: Summarize non-VM coverage
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("ci_artifacts/demo/non-vm/summary.json")
          print("## Non-VM Sponsor Coverage")
          if not path.exists():
              print("")
              print("No summary artifact was produced.")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          cases = data.get("cases") or []
          failures = [case for case in cases if not case.get("passed")]
          print("")
          print(f"- Passed: {len(cases) - len(failures)}/{len(cases)}")
          print(f"- Failures: {len(failures)}")
          for case in cases:
              status = "PASS" if case.get("passed") else "FAIL"
              print(f"- {status}: {case.get('category')} ({case.get('id')})")
          PY

      - name: Upload non-VM sponsor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-demo-non-vm
          path: ci_artifacts/demo/non-vm
          if-no-files-found: ignore

  vm-gpt-demo-e2e:
    name: VM bridge, MCP generation, and GPT tool proof
    needs: non-vm-sponsor-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download non-VM proof
        uses: actions/download-artifact@v4
        with:
          name: sponsor-demo-non-vm
          path: ci_artifacts/demo/non-vm

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lease before VM start
        run: python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-before-vm-start" --job-id "${{ github.run_id }}"

      - name: Start bridge VM
        timeout-minutes: 6
        run: |
          echo "Starting VM $VM_NAME"
          az vm start -g "$RESOURCE_GROUP" -n "$VM_NAME"
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-vm-started" --job-id "${{ github.run_id }}"

      - name: Fetch runtime secrets
        id: runtime-secrets
        run: |
          bridge_secret="$(az keyvault secret show --vault-name "$KEY_VAULT" --name gui-bridge-secret --query value -o tsv)"
          pipeline_key="$(az keyvault secret show --vault-name "$KEY_VAULT" --name pipeline-api-key --query value -o tsv)"
          echo "::add-mask::$bridge_secret"
          echo "::add-mask::$pipeline_key"
          echo "bridge_secret=$bridge_secret" >> "$GITHUB_OUTPUT"
          echo "pipeline_key=$pipeline_key" >> "$GITHUB_OUTPUT"

      - name: Wait for bridge health
        timeout-minutes: 8
        run: |
          for i in {1..84}; do
            python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-health-wait-$i" --job-id "${{ github.run_id }}"
            echo "Bridge health attempt $i"
            if curl -fsS -H "X-Bridge-Key: ${{ steps.runtime-secrets.outputs.bridge_secret }}" "$BRIDGE_URL/health"; then
              echo "Bridge health OK after attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "Bridge did not become healthy in time" >&2
          exit 1

      - name: Capture preflight diagnostics
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p ci_artifacts/demo/preflight
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-preflight" --job-id "${{ github.run_id }}" || true
          az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" -o json > ci_artifacts/demo/preflight/vm-instance-view.json || true
          az containerapp revision list -g "$RESOURCE_GROUP" -n "$PIPELINE_APP" -o json > ci_artifacts/demo/preflight/pipeline-revisions.json || true
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -H "X-Bridge-Key: ${{ steps.runtime-secrets.outputs.bridge_secret }}" "$BRIDGE_URL/health" > ci_artifacts/demo/preflight/bridge-health.txt || true
          az vm run-command invoke \
            -g "$RESOURCE_GROUP" \
            -n "$VM_NAME" \
            --command-id RunPowerShellScript \
            --scripts '$ErrorActionPreference = "Continue"
          Write-Output "repo_commit:"
          if (Test-Path "C:\mcp-factory\.git") { git -C "C:\mcp-factory" rev-parse HEAD }
          Write-Output "bridge_tasks:"
          Get-ScheduledTask | Where-Object { $_.TaskName -like "*Bridge*" -or $_.TaskName -like "*MCP*" } | Select-Object TaskName,TaskPath,State | ConvertTo-Json -Compress
          Write-Output "python_processes:"
          Get-Process python -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,Path,StartTime | ConvertTo-Json -Compress' \
            --query "value[0].message" \
            -o tsv > ci_artifacts/demo/preflight/vm-bridge-task.txt || true

      - name: Seed registry fixture
        timeout-minutes: 3
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-seed-registry" --job-id "${{ github.run_id }}"
          az vm run-command invoke \
            -g "$RESOURCE_GROUP" \
            -n "$VM_NAME" \
            --command-id RunPowerShellScript \
            --scripts '$ErrorActionPreference = "Stop"
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\contoso_mcp_factory_e2e.exe"
          New-Item -Path $key -Force -Value "C:\Windows\System32\notepad.exe" | Out-Null
          Set-Item -Path $key -Value "C:\Windows\System32\notepad.exe"
          Write-Output "Seeded $key"' \
            --query "value[0].message" \
            -o tsv

      - name: Scan Windows DLL - kernel32.dll
        continue-on-error: true
        timeout-minutes: 7
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-kernel32-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label kernel32_dll --kind system_path --target 'C:\Windows\System32\kernel32.dll' --timeout 150 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-kernel32-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Scan Windows EXE/CLI - cmd.exe
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-cmd-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label cmd_exe --kind system_path --target 'C:\Windows\System32\cmd.exe' --timeout 120 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-cmd-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Scan Windows GUI EXE - notepad.exe
        continue-on-error: true
        timeout-minutes: 7
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-notepad-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label notepad_exe --kind system_path --target 'C:\Windows\System32\notepad.exe' --timeout 150 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-notepad-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Scan Windows shell DLL - shell32.dll
        continue-on-error: true
        timeout-minutes: 7
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-shell32-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label shell32_dll --kind system_path --target 'C:\Windows\System32\shell32.dll' --timeout 150 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-shell32-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Scan COM/DCOM TLB - stdole2.tlb
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-stdole2-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label stdole2_tlb --kind system_path --target 'C:\Windows\System32\stdole2.tlb' --types com --expect-source-type com --timeout 120 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-stdole2-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Scan registry inventory target
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-registry-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label registry_contoso --kind registry --target 'C:\Windows\System32\notepad.exe' --hints contoso_mcp_factory_e2e --types registry --expect-source-type registry --expect-name-contains contoso --timeout 90 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-registry-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Scan installed directory target
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-directory-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py bridge-target-e2e --bridge-url "$BRIDGE_URL" --bridge-secret "${{ steps.runtime-secrets.outputs.bridge_secret }}" --label system32_directory --kind directory --target 'C:\Windows\System32' --hints "installed directory" --types directory --expect-source-type directory --timeout 90 --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-directory-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Summarize Windows target results
        continue-on-error: true
        run: |
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-windows-summary-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py summarize-bridge-e2e --out-dir ci_artifacts/demo/windows
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-windows-summary-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Run GPT per-format proof matrix
        continue-on-error: true
        timeout-minutes: 40
        run: |
          artifact_dir="ci_artifacts/demo/gpt-format-matrix"
          mkdir -p "$artifact_dir"
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-gpt-format-matrix-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py cloud-gpt-format-matrix \
            --base-url "$PIPELINE_URL" \
            --pipeline-key "${{ steps.runtime-secrets.outputs.pipeline_key }}" \
            --artifact-dir "$artifact_dir" \
            --sentinel-prefix "MCP_FACTORY_FORMAT_${{ github.run_id }}" \
            --lease-storage-account "$STORAGE_ACCOUNT" \
            --lease-container "$ARTIFACT_CONTAINER" \
            --lease-job-id "${{ github.run_id }}"
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-gpt-format-matrix-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Print GPT per-format proof summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ci_artifacts/demo/gpt-format-matrix/summary.json")
          print("## GPT Per-Format Proof Matrix")
          if not path.exists():
              print("No GPT format matrix summary exists.")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          print(f"total={data.get('total')} failures={data.get('failures')}")
          print(f"real_execution={data.get('real_execution_passed')}/{data.get('real_execution_total')}")
          print(f"provider_required={data.get('provider_required_tool_call_passed')}/{data.get('provider_required_total')}")
          for item in data.get("cases", []):
              status = "PASS" if item.get("passed") else "FAIL"
              print(f"{status} {item.get('id')}: proof={item.get('proof_level')} tool_call={item.get('tool_call_seen')} sentinel={item.get('sentinel_seen')} provider_required={item.get('provider_required_seen')}")
          PY

      - name: Create deterministic CMD target
        id: target
        run: |
          sentinel="MCP_FACTORY_DEMO_${{ github.run_id }}"
          target="$RUNNER_TEMP/mcp-factory-demo.cmd"
          {
            printf '@echo off\r\n'
            printf 'goto :eof\r\n'
            printf 'REM Echo deterministic sentinel for GPT/tool E2E.\r\n'
            printf ':EchoSentinel\r\n'
            printf 'echo %s\r\n' "$sentinel"
            printf 'exit /b 0\r\n'
          } > "$target"
          echo "sentinel=$sentinel" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Created deterministic CMD target at $target"

      - name: Run GPT-4o MCP tool proof
        continue-on-error: true
        timeout-minutes: 15
        run: |
          artifact_dir="ci_artifacts/demo/gpt4o"
          mkdir -p "$artifact_dir"
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-gpt-start" --job-id "${{ github.run_id }}"
          set +e
          python scripts/ci_verify.py cloud-gpt-e2e \
            --base-url "$PIPELINE_URL" \
            --pipeline-key "${{ steps.runtime-secrets.outputs.pipeline_key }}" \
            --target "${{ steps.target.outputs.target }}" \
            --tool-name EchoSentinel \
            --sentinel "${{ steps.target.outputs.sentinel }}" \
            --artifact-dir "$artifact_dir" \
            --transcript "$artifact_dir/transcript.json" \
            --lease-storage-account "$STORAGE_ACCOUNT" \
            --lease-container "$ARTIFACT_CONTAINER" \
            --lease-job-id "${{ github.run_id }}"
          status=$?
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-gpt-end" --job-id "${{ github.run_id }}" || true
          exit $status

      - name: Print GPT proof summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact_dir = Path("ci_artifacts/demo/gpt4o")
          for name in [
              "transcript.json",
              "selected-invocable.json",
              "generated-mcp-schema.json",
              "job-status-history.json",
              "downloaded-mcp-schema.json",
          ]:
              print(f"{name} exists={(artifact_dir / name).exists()}")
          transcript_path = artifact_dir / "transcript.json"
          if transcript_path.exists():
              transcript = json.loads(transcript_path.read_text(encoding="utf-8"))
              events = transcript.get("events") or []
              print(f"job_id={transcript.get('job_id')}")
              print(f"sentinel={transcript.get('sentinel')}")
              print(f"tool_call_events={sum(1 for evt in events if evt.get('type') == 'tool_call')}")
              print(f"tool_result_events={sum(1 for evt in events if evt.get('type') == 'tool_result')}")
          PY

      - name: Capture failure diagnostics
        if: failure()
        timeout-minutes: 4
        run: |
          mkdir -p ci_artifacts/demo/failure
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-failure-diagnostics" --job-id "${{ github.run_id }}" || true
          az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" -o json > ci_artifacts/demo/failure/vm-instance-view.json || true
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' -H "X-Bridge-Key: ${{ steps.runtime-secrets.outputs.bridge_secret }}" "$BRIDGE_URL/health" > ci_artifacts/demo/failure/bridge-health.txt || true
          az vm run-command invoke \
            -g "$RESOURCE_GROUP" \
            -n "$VM_NAME" \
            --command-id RunPowerShellScript \
            --scripts '$ErrorActionPreference = "Continue"
          Write-Output "bridge_tasks:"
          Get-ScheduledTask | Where-Object { $_.TaskName -like "*Bridge*" -or $_.TaskName -like "*MCP*" } | Select-Object TaskName,TaskPath,State | ConvertTo-Json -Compress
          Write-Output "python_processes:"
          Get-Process python -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,Path,StartTime | ConvertTo-Json -Compress
          Write-Output "recent_bridge_logs:"
          Get-ChildItem -Path "C:\mcp-factory" -Filter "*bridge*.log" -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object { Write-Output "LOG:$($_.FullName)"; Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue }' \
            --query "value[0].message" \
            -o tsv > ci_artifacts/demo/failure/vm-bridge-task.txt || true

      - name: Clean registry fixture
        if: always()
        run: |
          az vm run-command invoke \
            -g "$RESOURCE_GROUP" \
            -n "$VM_NAME" \
            --command-id RunPowerShellScript \
            --scripts 'Remove-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\contoso_mcp_factory_e2e.exe" -Recurse -Force -ErrorAction SilentlyContinue' \
            --query "value[0].message" \
            -o tsv || true

      - name: Deallocate bridge VM
        if: always()
        run: |
          mkdir -p ci_artifacts/demo
          python scripts/ci_verify.py touch-bridge-lease --storage-account "$STORAGE_ACCOUNT" --container "$ARTIFACT_CONTAINER" --reason "sponsor-demo-before-deallocate" --job-id "${{ github.run_id }}" || true
          set +e
          az vm deallocate -g "$RESOURCE_GROUP" -n "$VM_NAME"
          status=$?
          completed=false
          if [ "$status" -eq 0 ]; then
            completed=true
          fi
          cat > ci_artifacts/demo/vm-deallocation.json <<EOF
          {
            "attempted": true,
            "completed": $completed,
            "status_code": $status
          }
          EOF
          exit $status

      - name: Write final sponsor demo summary
        if: always()
        run: |
          set +e
          python scripts/ci_verify.py summarize-sponsor-demo \
            --non-vm-summary ci_artifacts/demo/non-vm/summary.json \
            --windows-summary ci_artifacts/demo/windows/summary.json \
            --gpt-artifact-dir ci_artifacts/demo/gpt4o \
            --gpt-matrix-summary ci_artifacts/demo/gpt-format-matrix/summary.json \
            --vm-deallocation ci_artifacts/demo/vm-deallocation.json \
            --out ci_artifacts/demo/final-summary.json \
            --markdown ci_artifacts/demo/final-summary.md
          status=$?
          if [ -f ci_artifacts/demo/final-summary.md ]; then
            cat ci_artifacts/demo/final-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload sponsor demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-demo-e2e
          path: ci_artifacts/demo
          if-no-files-found: ignore
