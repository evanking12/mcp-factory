name: Sponsor Remote DCOM Runtime Proof

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: mcp-factory-rg
  SERVER_VM_NAME: mcpfactory-runner-vm
  KEY_VAULT: mcp-factory-kv
  PIPELINE_URL: https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io
  SERVER_PUBLIC_TARGET: 20.124.33.45

jobs:
  remote-dcom-runtime:
    name: Controlled remote DCOM activation proof
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch pipeline key
        id: runtime-secrets
        shell: pwsh
        run: |
          $pipelineKey = az keyvault secret show --vault-name "$env:KEY_VAULT" --name pipeline-api-key --query value -o tsv
          Write-Output "::add-mask::$pipelineKey"
          "pipeline_key=$pipelineKey" >> $env:GITHUB_OUTPUT

      - name: Generate proof credential
        shell: pwsh
        run: |
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789".ToCharArray()
          $random = -join (1..28 | ForEach-Object { $chars | Get-Random })
          $dcomPassword = "Dcom!" + $random
          Write-Output "::add-mask::$dcomPassword"
          "DCOM_PASSWORD=$dcomPassword" >> $env:GITHUB_ENV

      - name: Run remote DCOM runtime proof
        shell: pwsh
        timeout-minutes: 20
        run: |
          python scripts/ci_verify.py windows-remote-dcom-runtime-proof `
            --resource-group "$env:RESOURCE_GROUP" `
            --server-vm-name "$env:SERVER_VM_NAME" `
            --client-mode local `
            --server-target "$env:SERVER_PUBLIC_TARGET" `
            --dcom-username "mcpdcom" `
            --dcom-password "$env:DCOM_PASSWORD" `
            --base-url "$env:PIPELINE_URL" `
            --pipeline-key "${{ steps.runtime-secrets.outputs.pipeline_key }}" `
            --out ci_artifacts/demo/windows/dcom/dcom.summary.json `
            --artifact-dir ci_artifacts/demo/windows/dcom `
            --sentinel "MCP_FACTORY_REMOTE_DCOM_${{ github.run_id }}"

      - name: Upload remote DCOM runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-remote-dcom-runtime
          path: ci_artifacts/demo
          if-no-files-found: warn
