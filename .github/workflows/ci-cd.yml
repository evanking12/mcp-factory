name: Legacy CI Smoke (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-smoke:
    name: Manual Linux smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r api/requirements.txt

      - name: Run Python smoke tests
        run: python -m pytest tests -q --ignore=tests/test_mcp_stdio.py

      - name: Run sponsor fixture contract
        run: python scripts/ci_verify.py run-fixture-contract --out ci_artifacts/legacy-smoke-contract

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-ci-smoke
          path: ci_artifacts
          if-no-files-found: ignore
