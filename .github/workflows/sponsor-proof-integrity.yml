name: Sponsor Proof Integrity

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Sponsor Demo E2E run ID to validate"
        required: true
        default: "24578415657"
      require_remote_dcom:
        description: "Require remote_dcom_runtime in final summary"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  proof-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download sponsor proof artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci_artifacts/demo
          gh run download "${{ inputs.run_id }}" \
            --repo evanking12/mcp-factory \
            --name sponsor-demo-e2e \
            --dir ci_artifacts/demo

      - name: Validate artifact completeness
        run: |
          python scripts/ci_verify.py validate-sponsor-artifact \
            --artifact-dir ci_artifacts/demo \
            --schema docs/sponsor/schemas/final-summary.schema.json \
            --out ci_artifacts/demo/proof-integrity/artifact-validation.json

      - name: Validate transcript integrity
        run: |
          python scripts/ci_verify.py validate-transcript-integrity \
            --artifact-dir ci_artifacts/demo \
            --pattern "**/transcript.json" \
            --out ci_artifacts/demo/proof-integrity/transcript-integrity.json

      - name: Guard runtime modes
        run: |
          extra_remote=""
          if [ "${{ inputs.require_remote_dcom }}" = "true" ]; then
            extra_remote="--require-remote-dcom"
          fi
          python scripts/ci_verify.py runtime-downgrade-guard \
            --final-summary ci_artifacts/demo/final-summary.json \
            --require-corba-orb \
            --require-msrpc \
            $extra_remote \
            --out ci_artifacts/demo/proof-integrity/runtime-downgrade-guard.json

      - name: Guard caveat consistency
        run: |
          python scripts/ci_verify.py caveat-consistency-guard \
            --files README.md docs/sponsor/proof-index.md docs/sponsor/caveats.md \
            --out ci_artifacts/demo/proof-integrity/caveat-consistency.json

      - name: Classify failure
        if: failure() || cancelled()
        run: |
          python scripts/ci_verify.py classify-failure \
            --text "Sponsor proof integrity workflow failed" \
            --out ci_artifacts/demo/proof-integrity/failure-diagnosis.json

      - name: Upload proof integrity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-proof-integrity
          path: ci_artifacts/demo/proof-integrity
          if-no-files-found: error
