name: Sponsor Repo Ingestion E2E

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: mcp-factory-rg
  KEY_VAULT: mcp-factory-kv
  PIPELINE_URL: https://mcp-factory-pipeline.icycoast-8ddfa278.eastus.azurecontainerapps.io

jobs:
  repo-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r api/requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch pipeline key
        id: runtime-secrets
        run: |
          pipeline_key="$(az keyvault secret show --vault-name "$KEY_VAULT" --name pipeline-api-key --query value -o tsv)"
          echo "::add-mask::$pipeline_key"
          echo "pipeline_key=$pipeline_key" >> "$GITHUB_OUTPUT"

      - name: Run repo-ingestion GPT proof
        run: |
          python scripts/ci_verify.py repo-ingestion-gpt-proof \
            --base-url "$PIPELINE_URL" \
            --pipeline-key "${{ steps.runtime-secrets.outputs.pipeline_key }}" \
            --artifact-dir ci_artifacts/demo/repo-ingestion

      - name: Upload repo-ingestion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-repo-ingestion-e2e
          path: ci_artifacts/demo/repo-ingestion
          if-no-files-found: error
